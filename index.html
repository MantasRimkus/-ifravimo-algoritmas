<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<title>AES Šifravimas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.js"></script>
</head>

<body>

<h2>AES Šifravimo Sistema</h2>

<textarea id="text" rows="5" cols="50" placeholder="Įvesk tekstą"></textarea><br><br>

<input type="text" id="key" placeholder="Slaptas raktas"><br><br>

<label>Modas:</label>
<select id="mode">
    <option value="ECB">ECB</option>
    <option value="CBC">CBC</option>
    <option value="CFB">CFB</option>
</select><br><br>

<label>Rakto ilgis:</label>
<select id="keysize">
    <option value="128">128</option>
    <option value="192">192</option>
    <option value="256">256</option>
</select><br><br>

<button onclick="encrypt()">Šifruoti</button>
<button onclick="decrypt()">Dešifruoti</button>
<button onclick="saveFile()">Išsaugoti</button>

<br><br>

<textarea id="output" rows="5" cols="50" placeholder="Rezultatas"></textarea><br><br>

<input type="file" onchange="loadFile(event)">

<script>
let lastMode = "";
let lastKeySize = "";
let lastIV = "";

function getKey(key, size) {
    let hash = CryptoJS.SHA256(key).toString();
    return CryptoJS.enc.Hex.parse(hash.substring(0, size / 4));
}

function getMode(mode) {
    if (mode === "ECB") return CryptoJS.mode.ECB;
    if (mode === "CBC") return CryptoJS.mode.CBC;
    if (mode === "CFB") return CryptoJS.mode.CFB;
}

function encrypt() {
    let text = document.getElementById("text").value;
    let keyText = document.getElementById("key").value;
    let mode = document.getElementById("mode").value;
    let size = document.getElementById("keysize").value;

    if (!text || !keyText) {
        alert("Įvesk tekstą ir raktą");
        return;
    }

    let key = getKey(keyText, size);
    let selectedMode = getMode(mode);
    let iv = CryptoJS.lib.WordArray.random(16);

    let options = {
        mode: selectedMode,
        padding: CryptoJS.pad.Pkcs7
    };

    if (mode !== "ECB") {
        options.iv = iv;
        lastIV = iv.toString();
    } else {
        lastIV = "";
    }

    let encrypted = CryptoJS.AES.encrypt(text, key, options);

    lastMode = mode;
    lastKeySize = size;

    document.getElementById("output").value = encrypted.ciphertext.toString();
}

function decrypt() {
    let cipherText = document.getElementById("output").value;
    let keyText = document.getElementById("key").value;

    if (!cipherText || !keyText) {
        alert("Nėra šifroteksto arba rakto");
        return;
    }

    let key = getKey(keyText, lastKeySize);
    let selectedMode = getMode(lastMode);

    let cipherParams = CryptoJS.lib.CipherParams.create({
        ciphertext: CryptoJS.enc.Hex.parse(cipherText)
    });

    let options = {
        mode: selectedMode,
        padding: CryptoJS.pad.Pkcs7
    };

    if (lastMode !== "ECB") {
        options.iv = CryptoJS.enc.Hex.parse(lastIV);
    }

    let decrypted = CryptoJS.AES.decrypt(cipherParams, key, options);
    let result = decrypted.toString(CryptoJS.enc.Utf8);

    if (!result) {
        alert("Nepavyko dešifruoti. Patikrink raktą arba pirmiausia užšifruok tekstą.");
        return;
    }

    document.getElementById("output").value = result;
}

function saveFile() {
    let data = document.getElementById("output").value;
    let blob = new Blob([data], {type: "text/plain"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "encrypted.txt";
    a.click();
}

function loadFile(event) {
    let file = event.target.files[0];
    let reader = new FileReader();

    reader.onload = function(e) {
        document.getElementById("text").value = e.target.result;
    };

    reader.readAsText(file);
}
</script>

</body>
</html>
